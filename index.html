<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODO 앱</title>
<style>
  :root {
    color-scheme: light dark;
    --background: #fafafa;
    --card: #ffffff;
    --foreground: #09090b;
    --muted: #f4f4f5;
    --muted-foreground: #71717a;
    --border: #e4e4e7;
    --primary: #18181b;
    --primary-hover: #27272a;
    --primary-foreground: #fafafa;
    --ring: #a1a1aa;
    --destructive: #dc2626;
    --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.07);
    --bezel: #18181b;
    --page-bg: #e4e4e7;
    --pink: #ec4899;
    --pink-hover: #db2777;
    --pink-soft: rgba(236, 72, 153, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #09090b;
      --card: #18181b;
      --foreground: #fafafa;
      --muted: #27272a;
      --muted-foreground: #a1a1aa;
      --border: #27272a;
      --primary: #fafafa;
      --primary-hover: #e4e4e7;
      --primary-foreground: #18181b;
      --ring: #52525b;
      --destructive: #ef4444;
      --shadow-sm: none;
      --shadow-md: none;
      --bezel: #000000;
      --page-bg: #000000;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", Roboto, sans-serif;
    margin: 0;
    background: var(--page-bg);
    color: var(--foreground);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* ── 모바일 폰 프레임 ── */
  .phone {
    position: relative;
    width: 390px;
    height: min(812px, 100vh - 40px);
    background: var(--bezel);
    border-radius: 46px;
    padding: 12px;
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.5);
    flex: 0 0 auto;
  }
  .phone-notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 26px;
    background: var(--bezel);
    border-radius: 0 0 18px 18px;
    z-index: 3;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    background: var(--background);
    border-radius: 34px;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
    padding: 52px 20px 28px;
  }
  .phone-screen::-webkit-scrollbar { display: none; }

  /* ── shadcn 스타일 폼 카드 ── */
  .form-card {
    width: 100%;
    background: var(--card);
    border: 2px solid var(--pink);
    border-radius: 12px;
    box-shadow: var(--shadow-sm);
    padding: 20px;
    margin-bottom: 28px;
  }
  .form-card h1 {
    margin: 0;
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .form-card .description {
    margin: 6px 0 18px;
    font-size: 0.85rem;
    color: var(--muted-foreground);
  }
  .field-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  .input-row + .field-label {
    margin-top: 14px;
  }
  .date-field {
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    .date-field { color-scheme: dark; }
  }
  .todo-field {
    flex: 1;
    height: 40px;
    padding: 0 12px;
    font-size: 0.9rem;
    font-family: inherit;
    color: var(--foreground);
    background: transparent;
    border: 1.5px solid var(--pink);
    border-radius: 8px;
    outline: none;
    transition: box-shadow 0.15s, border-color 0.15s;
    min-width: 0;
  }
  .todo-field::placeholder { color: var(--muted-foreground); }
  .todo-field:focus-visible {
    border-color: var(--pink);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--pink) 35%, transparent);
  }
  .btn {
    height: 40px;
    padding: 0 16px;
    font-size: 0.9rem;
    font-weight: 500;
    font-family: inherit;
    border: none;
    border-radius: 8px;
    background: var(--pink);
    color: #ffffff;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--pink-hover); }
  .hint {
    margin: 12px 0 0;
    font-size: 0.75rem;
    color: var(--muted-foreground);
  }
  .hint kbd {
    font-family: inherit;
    font-size: 0.7rem;
    background: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }

  /* ── Carousel ── */
  .carousel-section {
    width: 100%;
    display: none;
  }
  body.has-todos .carousel-section { display: block; }
  .carousel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .carousel-header .title {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .carousel-header .count {
    font-size: 0.68rem;
    color: var(--muted-foreground);
  }
  .carousel-viewport {
    overflow-x: auto;
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .carousel-viewport::-webkit-scrollbar { display: none; }
  .carousel-track {
    display: flex;
    gap: 14px;
    list-style: none;
    margin: 0;
    padding: 4px 0;
  }
  .card {
    flex: 0 0 100%;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-sm);
    padding: 12px 14px;
    min-height: 88px;
  }
  .card .card-title {
    flex: 1;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    word-break: break-all;
    line-height: 1.4;
  }
  .card.done .card-title {
    text-decoration: line-through;
    color: var(--muted-foreground);
    font-weight: 400;
  }
  .card .card-due {
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--pink);
    letter-spacing: -0.01em;
  }
  .card.done .card-due {
    color: var(--muted-foreground);
  }
  .card .card-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .check-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--muted-foreground);
    cursor: pointer;
    user-select: none;
  }
  .check-label input {
    accent-color: var(--primary);
    width: 13px;
    height: 13px;
    cursor: pointer;
  }
  .delete-btn {
    border: none;
    background: transparent;
    color: var(--muted-foreground);
    font-size: 0.9rem;
    cursor: pointer;
    line-height: 1;
    padding: 3px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }
  .delete-btn:hover {
    color: var(--destructive);
    background: var(--muted);
  }

  /* ── 작은 숫자 페이지 인디케이터 ── */
  .carousel-numbers {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
  }
  .num-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    font-size: 0.58rem;
    font-weight: 500;
    font-family: inherit;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .num-dot:hover { background: var(--muted); }
  .num-dot.active {
    background: var(--primary);
    color: var(--primary-foreground);
    border-color: var(--primary);
  }

  /* ── Footer: shadcn CarouselSize 데모 ── */
  .app-footer {
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }
  .app-footer .footer-label {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--muted-foreground);
    text-align: center;
    margin: 0 0 16px;
  }
  .demo-carousel {
    position: relative;
    width: 100%;
    max-width: 12rem;      /* 폰 프레임 기준 고정 폭 (좌우 핑크 버튼 공간 확보) */
    margin: 0 auto;
  }
  .demo-viewport {
    overflow-x: auto;
    scroll-behavior: smooth;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .demo-viewport::-webkit-scrollbar { display: none; }
  .demo-track {
    display: flex;
    align-items: center;
    list-style: none;
    margin: 0;
    padding: 0;
    min-height: 84px;
  }
  .demo-item {
    flex: 0 0 33.3333%;    /* 한 화면에 숫자 3개 */
    scroll-snap-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .demo-num {
    font-size: 1rem;       /* 좌우 숫자는 작게 */
    font-weight: 500;
    color: var(--muted-foreground);
    opacity: 0.5;
    line-height: 1;
    transition: font-size 0.2s, opacity 0.2s, color 0.2s, font-weight 0.2s;
  }
  .demo-item.is-center .demo-num {
    font-size: 2.75rem;    /* 가운데 숫자는 크게 */
    font-weight: 700;
    color: var(--foreground);
    opacity: 1;
  }
  /* CarouselPrevious / CarouselNext — shadcn 원형 아웃라인 */
  .demo-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(236, 72, 153, 0.5);   /* 핑크 50% 알파 */
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-sm);
    transition: background 0.15s, opacity 0.15s;
  }
  .demo-nav:hover:not(:disabled) { background: rgba(236, 72, 153, 0.7); }
  .demo-nav:disabled { opacity: 0.4; cursor: default; }
  .demo-nav.prev { left: -42px; }
  .demo-nav.next { right: -42px; }
  .demo-nav svg { width: 15px; height: 15px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div class="form-card">
        <h1>To Do</h1>
        <p class="description">오늘 해야 할 일을 정리해 보세요.</p>
        <label class="field-label" for="todo-input">할 일</label>
        <div class="input-row">
          <input type="text" id="todo-input" class="todo-field" placeholder="할 일을 입력하세요" autocomplete="off">
          <button id="add-btn" class="btn">추가</button>
        </div>
        <label class="field-label" for="due-input">마감 날짜</label>
        <div class="input-row">
          <input type="date" id="due-input" class="todo-field date-field">
        </div>
        <p class="hint"><kbd>Shift</kbd> + <kbd>Enter</kbd> 로도 추가할 수 있어요.</p>
      </div>

      <section class="carousel-section" aria-label="할 일 목록">
        <div class="carousel-header">
          <span class="title">내 할 일</span>
          <span class="count" id="todo-count"></span>
        </div>
        <div class="carousel-viewport" id="carousel-viewport">
          <ul class="carousel-track" id="card-list"></ul>
        </div>
        <div class="carousel-numbers" id="carousel-numbers"></div>
      </section>

      <footer class="app-footer">
        <p class="footer-label">Carousel Size</p>
        <div class="demo-carousel">
          <button class="demo-nav prev" id="demo-prev" aria-label="이전">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="demo-viewport" id="demo-viewport">
            <ul class="demo-track" id="demo-track"></ul>
          </div>
          <button class="demo-nav next" id="demo-next" aria-label="다음">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </footer>
    </div>
  </div>

<script>
  const STORAGE_KEY = "todos";

  // 배포한 Apps Script 웹앱 URL을 여기에 붙여넣으세요. 비워두면 이 브라우저의
  // localStorage만 사용합니다 (google-apps-script/Code.gs 참고).
  const APPS_SCRIPT_URL = "";

  const input = document.getElementById("todo-input");
  const dueInput = document.getElementById("due-input");
  const addBtn = document.getElementById("add-btn");
  const list = document.getElementById("card-list");
  const countEl = document.getElementById("todo-count");
  const viewport = document.getElementById("carousel-viewport");
  const numbersEl = document.getElementById("carousel-numbers");

  let todos = [];

  function isRemoteEnabled() {
    return Boolean(APPS_SCRIPT_URL);
  }

  function loadLocalTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveLocalTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  // ── 구글 시트(Apps Script) API 호출 ──
  async function apiList() {
    const res = await fetch(`${APPS_SCRIPT_URL}?action=list`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "목록을 불러오지 못했습니다.");
    return json.data;
  }

  async function apiRequest(action, payload) {
    // Content-Type을 text/plain으로 보내면 브라우저가 CORS 프리플라이트(OPTIONS)를
    // 띄우지 않아 Apps Script 웹앱에서도 문제없이 동작합니다.
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, ...payload }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "요청이 실패했습니다.");
    return json.data;
  }

  const apiCreate = (text, dueDate) => apiRequest("create", { text, dueDate });
  const apiUpdate = (id, patch) => apiRequest("update", { id, ...patch });
  const apiDelete = (id) => apiRequest("delete", { id });

  async function init() {
    if (isRemoteEnabled()) {
      try {
        todos = await apiList();
      } catch (err) {
        console.error("구글 시트 연동 실패, 로컬 데이터로 대체합니다.", err);
        todos = loadLocalTodos();
      }
    } else {
      todos = loadLocalTodos();
    }
    renderTodos();
  }

  const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

  function formatDueDate(dueDate) {
    const d = new Date(dueDate + "T00:00:00");
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const dd = String(d.getDate()).padStart(2, "0");
    return `${yyyy}.${mm}.${dd} (${WEEKDAYS[d.getDay()]})`;
  }

  function renderTodos() {
    list.innerHTML = "";
    document.body.classList.toggle("has-todos", todos.length > 0);
    const doneCount = todos.filter(t => t.done).length;
    countEl.textContent = `${doneCount}/${todos.length} 완료`;

    for (const todo of todos) {
      const li = document.createElement("li");
      li.className = "card" + (todo.done ? " done" : "");
      li.dataset.id = todo.id;

      const title = document.createElement("div");
      title.className = "card-title";
      title.textContent = todo.text;

      const due = document.createElement("div");
      due.className = "card-due";
      due.textContent = formatDueDate(todo.dueDate);

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const checkLabel = document.createElement("label");
      checkLabel.className = "check-label";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = todo.done;
      checkbox.addEventListener("change", () => toggleTodo(todo.id));
      checkLabel.appendChild(checkbox);
      checkLabel.appendChild(document.createTextNode("완료"));

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "✕";
      deleteBtn.title = "삭제";
      deleteBtn.addEventListener("click", () => deleteTodo(todo.id));

      actions.appendChild(checkLabel);
      actions.appendChild(deleteBtn);
      li.appendChild(title);
      li.appendChild(due);
      li.appendChild(actions);
      list.appendChild(li);
    }
    renderNumbers();
    updateActiveNumber();
    renderDemoNumbers();
  }

  async function addTodo(text, dueDate) {
    const trimmed = text.trim();
    if (!trimmed || !dueDate) return false;

    if (isRemoteEnabled()) {
      try {
        todos = await apiCreate(trimmed, dueDate);
      } catch (err) {
        alert("구글 시트에 저장하지 못했습니다: " + err.message);
        return false;
      }
    } else {
      todos.push({ id: String(Date.now()), text: trimmed, done: false, dueDate });
      saveLocalTodos();
    }
    renderTodos();
    // 새로 추가한 카드로 이동
    goToIndex(todos.length - 1);
    return true;
  }

  async function toggleTodo(id) {
    const todo = todos.find(t => t.id === id);
    if (!todo) return;

    if (isRemoteEnabled()) {
      try {
        todos = await apiUpdate(id, { done: !todo.done });
      } catch (err) {
        alert("완료 상태를 저장하지 못했습니다: " + err.message);
        return;
      }
    } else {
      todo.done = !todo.done;
      saveLocalTodos();
    }
    renderTodos();
  }

  async function deleteTodo(id) {
    if (isRemoteEnabled()) {
      try {
        todos = await apiDelete(id);
      } catch (err) {
        alert("삭제하지 못했습니다: " + err.message);
        return;
      }
    } else {
      todos = todos.filter(t => t.id !== id);
      saveLocalTodos();
    }
    renderTodos();
  }

  addBtn.addEventListener("click", async () => {
    if (await addTodo(input.value, dueInput.value)) {
      input.value = "";
      dueInput.value = "";
      input.focus();
    }
  });
  input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter" && e.shiftKey) {
      if (await addTodo(input.value, dueInput.value)) {
        input.value = "";
        dueInput.value = "";
      }
    }
  });

  // ── 작은 숫자 페이지 인디케이터 ──
  function cards() {
    return [...list.children];
  }

  function renderNumbers() {
    numbersEl.innerHTML = "";
    todos.forEach((_, i) => {
      const btn = document.createElement("button");
      btn.className = "num-dot";
      btn.textContent = i + 1;
      btn.addEventListener("click", () => goToIndex(i));
      numbersEl.appendChild(btn);
    });
  }

  function goToIndex(i) {
    const els = cards();
    if (!els[i]) return;
    const left = els[i].offsetLeft - els[0].offsetLeft;
    viewport.scrollTo({ left, behavior: "smooth" });
  }

  function currentIndex() {
    const els = cards();
    if (els.length === 0) return 0;
    const base = els[0].offsetLeft;
    let best = 0, bestDist = Infinity;
    els.forEach((el, i) => {
      const dist = Math.abs((el.offsetLeft - base) - viewport.scrollLeft);
      if (dist < bestDist) { bestDist = dist; best = i; }
    });
    return best;
  }

  function updateActiveNumber() {
    const active = currentIndex();
    [...numbersEl.children].forEach((btn, i) => {
      btn.classList.toggle("active", i === active);
    });
  }

  viewport.addEventListener("scroll", () => { updateActiveNumber(); updateDemoSync(); });
  window.addEventListener("resize", () => { updateActiveNumber(); updateDemoSync(); });

  // ── Footer: 할 일 목록과 동일한 숫자로 동기화되는 캐러셀 ──
  const demoTrack = document.getElementById("demo-track");
  const demoViewport = document.getElementById("demo-viewport");
  const demoPrev = document.getElementById("demo-prev");
  const demoNext = document.getElementById("demo-next");

  function demoItems() {
    return [...demoTrack.children];
  }

  // 할 일 개수·순서와 동일한 숫자를 만들고, 클릭하면 실제 할 일 캐러셀이 이동합니다.
  function renderDemoNumbers() {
    demoTrack.innerHTML = "";
    todos.forEach((_, i) => {
      const li = document.createElement("li");
      li.className = "demo-item";
      const num = document.createElement("span");
      num.className = "demo-num";
      num.textContent = i + 1;
      li.appendChild(num);
      li.addEventListener("click", () => goToIndex(i));
      demoTrack.appendChild(li);
    });
    updateDemoSync();
  }

  function updateDemoNav() {
    const active = currentIndex();
    demoPrev.disabled = todos.length === 0 || active <= 0;
    demoNext.disabled = todos.length === 0 || active >= todos.length - 1;
  }

  // 실제 할 일 캐러셀의 현재 위치(currentIndex)에 맞춰 숫자 캐러셀의
  // 가운데 숫자·스크롤 위치를 동기화합니다.
  function updateDemoSync() {
    const els = demoItems();
    const active = currentIndex();
    els.forEach((el, i) => el.classList.toggle("is-center", i === active));
    if (els[active]) {
      const left = (els[active].offsetLeft - els[0].offsetLeft)
        - (demoViewport.clientWidth - els[active].offsetWidth) / 2;
      demoViewport.scrollTo({ left: Math.max(left, 0), behavior: "smooth" });
    }
    updateDemoNav();
  }

  demoPrev.addEventListener("click", () => goToIndex(currentIndex() - 1));
  demoNext.addEventListener("click", () => goToIndex(currentIndex() + 1));
  window.addEventListener("resize", updateDemoSync);

  init();
</script>
</body>
</html>
